services:
  postgres:
    image: postgres:16
    container_name: ubb-events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ubb_events
      POSTGRES_USER: ubb
      POSTGRES_PASSWORD: ubb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubb -d ubb_events"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
