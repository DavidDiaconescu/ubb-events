spring.application.name=backend

# Datasource: overridable via env vars (see .env.example); defaults match docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ubb_events}
spring.datasource.username=${DB_USERNAME:ubb}
spring.datasource.password=${DB_PASSWORD:ubb}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Authentication
# BR-28: only institutional addresses can register; change the list here, no code change needed
app.auth.allowed-email-domains=stud.ubbcluj.ro,ubbcluj.ro
app.auth.jwt.expiration=24h
# HS256 signing key (min. 32 bytes). The default is for local development ONLY:
# every deployed environment must set JWT_SECRET.
app.auth.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-ubb-events-0123456789}

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=http://localhost:3000
